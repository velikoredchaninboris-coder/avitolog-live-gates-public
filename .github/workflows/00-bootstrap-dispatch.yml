name: AVITOLOG Bootstrap Dispatch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/00-bootstrap-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact hash-pinned live gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/workflows/avitolog-free-live-gates.yml/dispatches"             -d '{"ref":"main"}'
# trigger: M75 public live gates 2026-09-27
