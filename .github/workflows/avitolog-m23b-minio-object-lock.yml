name: AVITOLOG M23B MinIO Object Lock Live Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avitolog-m23b-minio-object-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avitolog-m23b-minio-object-lock
  cancel-in-progress: false

jobs:
  object-lock-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MINIO_ROOT_USER: avitolog_m23b
      MINIO_ROOT_PASSWORD: AVITOLOG_M23B_SYNTHETIC_PASSWORD_2026
      AWS_ACCESS_KEY_ID: avitolog_m23b
      AWS_SECRET_ACCESS_KEY: AVITOLOG_M23B_SYNTHETIC_PASSWORD_2026
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          go version
          aws --version
          curl --version | head -1
          git --version

      - name: Build pinned MinIO server from source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/minio/minio.git /tmp/minio-src
          cd /tmp/minio-src
          git checkout 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          test "$(git rev-parse HEAD)" = "9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a"
          go build -trimpath -o /tmp/minio-server .
          /tmp/minio-server --version | tee "$GITHUB_WORKSPACE/minio-version.txt"

      - name: Start isolated MinIO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/minio-data
          nohup /tmp/minio-server server /tmp/minio-data --address :9000 --console-address :9001 > /tmp/minio.log 2>&1 &
          echo $! > /tmp/minio.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/minio.log
          exit 1

      - name: Verify live S3 Object Lock semantics
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/m23b-out"
          mkdir -p "$OUT"
          BUCKET="avitolog-m23b-object-lock"
          KEY="evidence/m23b-canary.json"

          printf '{"kind":"synthetic_canary","gate":"M23B","generation":1}\n' > /tmp/canary-v1.json
          printf '{"kind":"synthetic_canary","gate":"M23B","generation":2}\n' > /tmp/canary-v2.json
          SHA1="$(sha256sum /tmp/canary-v1.json | awk '{print $1}')"
          SHA2="$(sha256sum /tmp/canary-v2.json | awk '{print $1}')"

          aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket             --bucket "$BUCKET"             --object-lock-enabled-for-bucket >/dev/null

          aws --endpoint-url "$S3_ENDPOINT" s3api put-object-lock-configuration             --bucket "$BUCKET"             --object-lock-configuration '{"ObjectLockEnabled":"Enabled","Rule":{"DefaultRetention":{"Mode":"COMPLIANCE","Days":1}}}'

          aws --endpoint-url "$S3_ENDPOINT" s3api get-object-lock-configuration             --bucket "$BUCKET" > "$OUT/object-lock-config.json"

          PUT1="$(aws --endpoint-url "$S3_ENDPOINT" s3api put-object             --bucket "$BUCKET" --key "$KEY" --body /tmp/canary-v1.json)"
          printf '%s\n' "$PUT1" > "$OUT/put-v1.json"
          V1="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["VersionId"])' <<<"$PUT1")"

          aws --endpoint-url "$S3_ENDPOINT" s3api get-object-retention             --bucket "$BUCKET" --key "$KEY" --version-id "$V1" > "$OUT/retention-v1.json"

          aws --endpoint-url "$S3_ENDPOINT" s3api get-object             --bucket "$BUCKET" --key "$KEY" --version-id "$V1" /tmp/readback-v1.json >/dev/null
          READBACK1="$(sha256sum /tmp/readback-v1.json | awk '{print $1}')"
          test "$READBACK1" = "$SHA1"

          DELETE_V1_BLOCKED=false
          if aws --endpoint-url "$S3_ENDPOINT" s3api delete-object               --bucket "$BUCKET" --key "$KEY" --version-id "$V1"               >/tmp/delete-v1.out 2>/tmp/delete-v1.err; then
            DELETE_V1_BLOCKED=false
          else
            DELETE_V1_BLOCKED=true
          fi
          test "$DELETE_V1_BLOCKED" = true

          SHORTEN_BLOCKED=false
          EARLY="$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          if aws --endpoint-url "$S3_ENDPOINT" s3api put-object-retention               --bucket "$BUCKET" --key "$KEY" --version-id "$V1"               --retention "Mode=COMPLIANCE,RetainUntilDate=$EARLY"               >/tmp/shorten.out 2>/tmp/shorten.err; then
            SHORTEN_BLOCKED=false
          else
            SHORTEN_BLOCKED=true
          fi
          test "$SHORTEN_BLOCKED" = true

          PUT2="$(aws --endpoint-url "$S3_ENDPOINT" s3api put-object             --bucket "$BUCKET" --key "$KEY" --body /tmp/canary-v2.json)"
          printf '%s\n' "$PUT2" > "$OUT/put-v2.json"
          V2="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["VersionId"])' <<<"$PUT2")"
          test "$V2" != "$V1"

          aws --endpoint-url "$S3_ENDPOINT" s3api get-object             --bucket "$BUCKET" --key "$KEY" --version-id "$V1" /tmp/readback-v1-after-v2.json >/dev/null
          READBACK1_AFTER="$(sha256sum /tmp/readback-v1-after-v2.json | awk '{print $1}')"
          test "$READBACK1_AFTER" = "$SHA1"

          aws --endpoint-url "$S3_ENDPOINT" s3api get-object             --bucket "$BUCKET" --key "$KEY" --version-id "$V2" /tmp/readback-v2.json >/dev/null
          READBACK2="$(sha256sum /tmp/readback-v2.json | awk '{print $1}')"
          test "$READBACK2" = "$SHA2"

          aws --endpoint-url "$S3_ENDPOINT" s3api list-object-versions             --bucket "$BUCKET" --prefix "$KEY" > "$OUT/versions.json"
          VERSION_COUNT="$(python3 - "$OUT/versions.json" <<'PY'
import json,sys
x=json.load(open(sys.argv[1]))
print(len(x.get("Versions") or []))
PY
)"
          test "$VERSION_COUNT" -ge 2

          DELETE_V2_BLOCKED=false
          if aws --endpoint-url "$S3_ENDPOINT" s3api delete-object               --bucket "$BUCKET" --key "$KEY" --version-id "$V2"               >/tmp/delete-v2.out 2>/tmp/delete-v2.err; then
            DELETE_V2_BLOCKED=false
          else
            DELETE_V2_BLOCKED=true
          fi
          test "$DELETE_V2_BLOCKED" = true

          python3 - "$OUT" "$V1" "$V2" "$SHA1" "$SHA2" "$VERSION_COUNT" <<'PY'
import json,sys,datetime,pathlib
out=pathlib.Path(sys.argv[1])
v1,v2,sha1,sha2,count=sys.argv[2:]
lock=json.load(open(out/"object-lock-config.json"))
ret=json.load(open(out/"retention-v1.json"))
mode=(ret.get("Retention") or {}).get("Mode")
until=(ret.get("Retention") or {}).get("RetainUntilDate")
report={
  "gate":"M23B_MINIO_OBJECT_LOCK_LIVE",
  "technology":"MinIO S3-compatible Object Lock",
  "technology_maturity":"LAB",
  "minio_source_commit":"9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a",
  "bucket_lock_enabled":lock.get("ObjectLockConfiguration",{}).get("ObjectLockEnabled")=="Enabled",
  "default_retention_mode":((lock.get("ObjectLockConfiguration",{}).get("Rule") or {}).get("DefaultRetention") or {}).get("Mode"),
  "version1":v1,
  "version2":v2,
  "version_count":int(count),
  "original_sha256":sha1,
  "replacement_sha256":sha2,
  "original_version_readback_preserved":True,
  "delete_version1_blocked":True,
  "delete_version2_blocked":True,
  "retention_shorten_blocked":True,
  "retention_mode":mode,
  "retain_until":until,
  "status":"PASS"
}
checks=[
 report["bucket_lock_enabled"],
 report["default_retention_mode"]=="COMPLIANCE",
 report["version_count"]>=2,
 report["delete_version1_blocked"],
 report["delete_version2_blocked"],
 report["retention_shorten_blocked"],
 report["retention_mode"]=="COMPLIANCE",
 report["original_sha256"]!=report["replacement_sha256"],
]
if not all(checks):
 report["status"]="FAIL"
(out/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
print(json.dumps(report,ensure_ascii=False,indent=2))
if report["status"]!="PASS":
 raise SystemExit(2)
PY

          cp /tmp/delete-v1.err "$OUT/delete-v1.err" || true
          cp /tmp/delete-v2.err "$OUT/delete-v2.err" || true
          cp /tmp/shorten.err "$OUT/shorten-retention.err" || true
          cp "$GITHUB_WORKSPACE/minio-version.txt" "$OUT/minio-version.txt"

      - name: Upload M23B evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m23b-minio-object-lock-live
          path: |
            m23b-out/
            minio-version.txt
          if-no-files-found: warn
          retention-days: 7
