name: AVITOLOG M57B PostgreSQL HA Lab
on:
  push:
    branches: [main]
    paths: ['.github/workflows/avitolog-m57b-ha-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build two-node PostgreSQL streaming replication
        run: |
          set -euo pipefail
          IMG='postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f'
          docker pull "$IMG"
          docker network create avitolog-ha-net
          docker volume create pg-primary-data
          docker volume create pg-standby-data
          docker run -d --name pg-primary --network avitolog-ha-net --network-alias pg-primary \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=qa-postgres-password \
            -e POSTGRES_DB=ha_lab \
            -v pg-primary-data:/var/lib/postgresql/data \
            "$IMG" \
            postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby=on
          for i in $(seq 1 60); do
            docker exec pg-primary pg_isready -U postgres -d ha_lab && break
            sleep 1
          done
          docker exec pg-primary psql -U postgres -d ha_lab -v ON_ERROR_STOP=1 -c "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'qa-repl-password';"
          docker exec pg-primary bash -lc "echo 'host replication replicator 0.0.0.0/0 scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf"
          docker exec pg-primary psql -U postgres -d ha_lab -c "select pg_reload_conf();"
          docker run --rm --network avitolog-ha-net \
            -e PGPASSWORD=qa-repl-password \
            -v pg-standby-data:/var/lib/postgresql/data \
            "$IMG" \
            bash -lc 'rm -rf /var/lib/postgresql/data/* && pg_basebackup -h pg-primary -U replicator -D /var/lib/postgresql/data -R -X stream -C -S avitolog_slot'
          docker run -d --name pg-standby --network avitolog-ha-net --network-alias pg-standby \
            -e POSTGRES_PASSWORD=qa-postgres-password \
            -v pg-standby-data:/var/lib/postgresql/data \
            "$IMG"
          for i in $(seq 1 60); do
            docker exec pg-standby pg_isready -U postgres -d ha_lab && break
            sleep 1
          done
          docker exec pg-standby psql -U postgres -d ha_lab -Atqc "select pg_is_in_recovery();" | tee standby_recovery_before.txt
          test "$(cat standby_recovery_before.txt)" = "t"
      - name: Replication and failover drill
        run: |
          set -euo pipefail
          docker exec pg-primary psql -U postgres -d ha_lab -v ON_ERROR_STOP=1 -c "create table failover_probe(id int primary key,payload text); insert into failover_probe values(1,'before-failover');"
          VAL=""
          for i in $(seq 1 60); do
            VAL=$(docker exec pg-standby psql -U postgres -d ha_lab -Atqc "select payload from failover_probe where id=1;" 2>/dev/null || true)
            [ "$VAL" = "before-failover" ] && break
            sleep 1
          done
          test "$VAL" = "before-failover"
          T0=$(date +%s%3N)
          docker stop pg-primary >/dev/null
          docker exec pg-standby psql -U postgres -d ha_lab -Atqc "select pg_promote(wait_seconds => 60);" | tee promote_result.txt
          REC=""
          for i in $(seq 1 60); do
            REC=$(docker exec pg-standby psql -U postgres -d ha_lab -Atqc "select pg_is_in_recovery();" 2>/dev/null || true)
            [ "$REC" = "f" ] && break
            sleep 1
          done
          T1=$(date +%s%3N)
          FAILOVER_MS=$((T1-T0))
          test "$REC" = "f"
          docker exec pg-standby psql -U postgres -d ha_lab -v ON_ERROR_STOP=1 -c "insert into failover_probe values(2,'after-failover');"
          COUNT=$(docker exec pg-standby psql -U postgres -d ha_lab -Atqc "select count(*) from failover_probe;")
          test "$COUNT" = "2"
          export FAILOVER_MS
          python3 - <<'PY'
          import json, pathlib, os
          report={
            "gate":"M57B_POSTGRESQL_TWO_NODE_HA_LAB",
            "streaming_replication":True,
            "replica_readback_before_failover":True,
            "primary_failure_simulated":True,
            "standby_promoted":True,
            "write_after_failover":True,
            "rows_after_failover":2,
            "failover_ms":int(os.environ["FAILOVER_MS"]),
            "topology":"2_NODE_EPHEMERAL_GITHUB_RUNNER",
            "automatic_failover":False,
            "durable_multi_failure_domain":False,
            "status":"PASS_LAB_NOT_PRODUCTION"
          }
          pathlib.Path("m57b_ha_report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m57b-postgresql-ha-lab
          path: |
            m57b_ha_report.json
            standby_recovery_before.txt
            promote_result.txt
          retention-days: 7
