name: AVITOLOG M21B Keycloak OIDC MFA Live Mechanics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avitolog-m21b-keycloak-mfa.yml'
      - 'avito-live-infra/oidc_mfa_drill_v2.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avitolog-m21b-keycloak-mfa
  cancel-in-progress: false

jobs:
  oidc-mfa-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Keycloak OIDC MFA and re-auth drill
        run: chmod +x avito-live-infra/oidc_mfa_drill.sh && avito-live-infra/oidc_mfa_drill.sh
      - name: Upload redacted M21B evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m21b-keycloak-oidc-mfa-v2
          path: avito-live-infra/out/oidc-mfa-v2/
          if-no-files-found: warn
          retention-days: 7
