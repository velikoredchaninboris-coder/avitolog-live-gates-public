name: AVITOLOG M24B Fresh DR v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/avitolog-m24b-dr-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-dr-restore-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avito_dr_restore
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d avito_dr_restore"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: avito_dr_restore
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable DR inputs
        run: |
          echo '37aa20760433b0e652b7d98f3ac6f151c01d0ba88abe0cf6c5569806546281fb  avito-m52b-canonical/001_core.up.sql' | sha256sum -c -
          echo 'b35abfbdb52164f66713bf361066d2a2863a97872d646d1cf687e1215232c525  avito-m52b-canonical/002_immutability_guards.up.sql' | sha256sum -c -
          echo 'bccbe4553633ef40f2bd2d4969e0faaea1832c01ab949fe7e2a3ae060ec4fff9  avito-m24b-dr/003_live_hardening.sql' | sha256sum -c -
          echo '8bf4566cb8271d175dc006f8693993ecc485222b777fb7f0bba88df534265674  avito-m24b-dr/source_data.json' | sha256sum -c -
          echo 'e4adec57c3342e2d6d3f32eb1da7e29b69d23e626d3ca420f7e341f576d42836  avito-m24b-dr/source_manifest.json' | sha256sum -c -
      - name: Fresh independent restore and guard verification v2
        run: python3 avito-m24b-dr/restore_and_verify_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m24b-fresh-dr-restore-v2
          path: avito-m24b-dr/out/
          retention-days: 7
